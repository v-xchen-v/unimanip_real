robot:
  sdk_type: "a2d"          # or "example", "dry_run", etc., used by create_robot_sdk
  num_joints: 14           # matches RobotSDKWrapper

  # Indices into RobotState.joint_angles for right arm & body
  joint_mapping:
    right_arm_indices: [7, 8, 9, 10, 11, 12, 13]   # example: right arm is last 7 joints
    body_indices: [0, 1]                           # example: use first 2 as "body" joints

    right_arm_joint_names:
      - idx61_arm_r_joint1
      - idx62_arm_r_joint2
      - idx63_arm_r_joint3
      - idx64_arm_r_joint4
      - idx65_arm_r_joint5
      - idx66_arm_r_joint6
      - idx67_arm_r_joint7

    body_joint_names:
      - idx01_body_joint1
      - idx02_body_joint2

  sensors:
    head_depth_available: true
    right_arm_depth_available: false   # we’ll return all-zero image for this
